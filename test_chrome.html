
        <!DOCTYPE html>
        <html>
        <head>
        <style>
        body { margin: 0; background: #333; }
        .wrapper {
            width: 640px;
            height: 360px;
            position: relative;
            background: #000;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: fill;
            transform-origin: 0 0;
        }
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        </style>
        </head>
        <body>
        <div class="wrapper">
            <video id="v" autoplay playsinline muted></video>
            <canvas id="c" width="640" height="360"></canvas>
        </div>
        <script style="display:none">
        // Create a canvas stream to feed video
        const feedCanvas = document.createElement('canvas');
        feedCanvas.width = 640; feedCanvas.height = 360;
        const feedCtx = feedCanvas.getContext('2d');
        feedCtx.fillStyle = 'red';
        feedCtx.fillRect(0, 0, 640, 360);
        feedCtx.fillStyle = 'white';
        feedCtx.font = '40px sans-serif';
        feedCtx.fillText('CAMERA FEED 640x360', 50, 180);

        // Draw grid lines
        feedCtx.strokeStyle = 'yellow';
        feedCtx.lineWidth = 10;
        feedCtx.strokeRect(20, 20, 600, 320);

        const video = document.getElementById('v');
        video.srcObject = feedCanvas.captureStream(30);

        function solve(A, b) {
            const n = A.length;
            for (let i = 0; i < n; i++) {
                let max = i;
                for (let j = i + 1; j < n; j++) {
                    if (Math.abs(A[j][i]) > Math.abs(A[max][i])) max = j;
                }
                [A[i], A[max]] = [A[max], A[i]];
                [b[i], b[max]] = [b[max], b[i]];
                if (Math.abs(A[i][i]) < 1e-9) return null;
                for (let j = i + 1; j < n; j++) {
                    const factor = A[j][i] / A[i][i];
                    b[j] -= factor * b[i];
                    for (let k = i; k < n; k++) A[j][k] -= factor * A[i][k];
                }
            }
            const x = new Array(n);
            for (let i = n - 1; i >= 0; i--) {
                let sum = 0;
                for (let j = i + 1; j < n; j++) sum += A[i][j] * x[j];
                x[i] = (b[i] - sum) / A[i][i];
            }
            return x;
        }

        function getHomography(src, dst) {
            const A = [], b = [];
            for (let i = 0; i < 4; i++) {
                const { x, y } = src[i];
                const { x: u, y: v } = dst[i];
                A.push([x, y, 1, 0, 0, 0, -x * u, -y * u]);
                b.push(u);
                A.push([0, 0, 0, x, y, 1, -x * v, -y * v]);
                b.push(v);
            }
            const res = solve(A, b);
            if (!res) return [1, 0, 0, 0, 1, 0, 0, 0, 1];
            return [res[0], res[1], res[2], res[3], res[4], res[5], res[6], res[7], 1];
        }

        function toMatrix3d(h) {
            const m = [
                h[0], h[3], 0, h[6],
                h[1], h[4], 0, h[7],
                0,    0,    1, 0,
                h[2], h[5], 0, h[8]
            ];
            return `matrix3d(${m.join(',')})`;
        }

        window.applyTransform = function(points) {
            const cw = 640, ch = 360;
            const corners = [{x: 0, y: 0}, {x: cw, y: 0}, {x: cw, y: ch}, {x: 0, y: ch}];
            const target = points.map(p => ({ x: (p.x / 100) * cw, y: (p.y / 100) * ch }));
            const H_inv = getHomography(target, corners);
            video.style.transformOrigin = '0 0';
            video.style.transform = toMatrix3d(H_inv);
            video.style.objectFit = 'fill';
            return toMatrix3d(H_inv);
        };
        </script>
        </body>
        </html>
