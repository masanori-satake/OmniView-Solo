name: 'リリースパッケージ公開 (Release Package)'

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: '共通リリース処理実行 (Execute Base Release)'
    uses: masanori-satake/common-workflows/.github/workflows/base-release.yml@v1
    permissions:
      contents: write
    with:
      # リリース ZIP は base-release 側で {リポジトリ名}-v{version}.zip に統一生成する（方式A）。
      # マニフェストは projects/app/manifest.json に統一済みのため manifest_rename は不要。
      package_source_dir: 'projects/app'
    # npm run build (= check_version.py → check_messages.py) はリリース前の整合性検証のみを行い、
    # ZIP 生成は base-release(package-extension) に委譲する。
    # アイコンはコミット済みPNGを同梱するため generate_icons は使用しない
    # （OmniView のアイコン生成は assets 出力 + web 同期という固有処理のため npm run icons で管理）。
