name: "タグ: バージョンタグの付与 (Tag: Create Version Tag)"

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Bumping type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: npm run version:bump -- ${{ github.event.inputs.version_type }}

      - name: Get version
        id: get_version
        run: echo "VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        run: |
          git add .
          git commit -m "chore: bump version to v${{ steps.get_version.outputs.VERSION }}"
          git push origin main

      - name: Create and push tag
        run: |
          git tag v${{ steps.get_version.outputs.VERSION }}
          git push origin v${{ steps.get_version.outputs.VERSION }}
