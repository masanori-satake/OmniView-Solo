<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniView-Solo</title>
    <link rel="stylesheet" href="shared/css/m3-theme.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body class="theme-light">
    <div id="app" class="layout-narrow">
        <header id="app-header">
            <div class="header-actions">
                <button id="add-camera-nav-btn" class="m3-icon-button" title="カメラ追加">
                    <span class="material-symbols-outlined">video_call</span>
                </button>
                <button id="settings-btn" class="m3-icon-button" title="設定">
                    <span class="material-symbols-outlined">settings</span>
                </button>
            </div>
        </header>

        <div id="settings-panel" class="hidden">
            <div id="settings-overlay"></div>
            <div class="settings-content m3-surface">
                <nav class="settings-tabs">
                    <button class="tab-btn active" data-tab="general" data-tooltip="一般">
                        <span class="material-symbols-outlined">tune</span>
                    </button>
                    <button class="tab-btn" data-tab="camera-info" data-tooltip="カメラ情報">
                        <span class="material-symbols-outlined">videocam</span>
                    </button>
                    <button class="tab-btn" data-tab="logs" data-tooltip="ログ">
                        <span class="material-symbols-outlined">description</span>
                    </button>
                    <button class="tab-btn" data-tab="about" data-tooltip="About">
                        <span class="material-symbols-outlined">info</span>
                    </button>
                </nav>
                <div class="tab-content" id="tab-general">
                    <div class="settings-row">
                        <label for="cycling-switch">自動切り替え</label>
                        <label class="m3-switch">
                            <input type="checkbox" id="cycling-switch" checked>
                            <span class="slider">
                                <span class="material-symbols-outlined slider-icon icon-left">close</span>
                                <span class="material-symbols-outlined slider-icon icon-right">check</span>
                            </span>
                        </label>
                    </div>
                    <div class="settings-row">
                        <label for="interval-input">表示間隔 (秒)</label>
                        <div class="m3-spinbox">
                            <input type="number" id="interval-input" value="5" min="1" step="1">
                            <div class="spinbox-controls">
                                <button type="button" id="interval-up" class="spin-btn">
                                    <span class="material-symbols-outlined">arrow_drop_up</span>
                                </button>
                                <button type="button" id="interval-down" class="spin-btn">
                                    <span class="material-symbols-outlined">arrow_drop_down</span>
                                </button>
                            </div>
                        </div>
                    </div>
                    <hr class="m3-divider">
                    <div class="settings-row-vertical">
                        <label>設定の入出力</label>
                        <div class="settings-action-group">
                            <button id="export-btn" class="m3-button">
                                <span class="material-symbols-outlined">download</span>
                                エクスポート
                            </button>
                            <button id="import-btn-trigger" class="m3-button">
                                <span class="material-symbols-outlined">upload</span>
                                インポート
                            </button>
                            <input type="file" id="import-input" class="hidden" accept=".json">
                        </div>
                    </div>
                    <div class="settings-row">
                        <label for="import-mode-select">インポート設定:</label>
                        <select id="import-mode-select" class="m3-select">
                            <option value="add">追記</option>
                            <option value="overwrite">上書き</option>
                        </select>
                    </div>
                </div>
                <div class="tab-content hidden" id="tab-camera-info">
                    <div class="settings-row">
                        <label for="info-camera-select">カメラ選択</label>
                        <select id="info-camera-select" class="m3-select"></select>
                    </div>
                    <div id="camera-capabilities-list" class="info-list">
                        <!-- Info will be injected here -->
                    </div>
                </div>
                <div class="tab-content hidden" id="tab-logs">
                    <div class="logs-header">
                        <button id="copy-logs-btn" class="m3-button">
                            <span class="material-symbols-outlined">content_copy</span>
                            ログをコピー
                        </button>
                        <button id="clear-logs-btn" class="m3-button">
                            <span class="material-symbols-outlined">delete</span>
                            消去
                        </button>
                    </div>
                    <div id="logs-container" class="logs-list">
                        <!-- Logs will be injected here -->
                    </div>
                </div>
                <div class="tab-content hidden" id="tab-about">
                    <div class="about-info">
                        <p><strong>OmniView-Solo</strong></p>
                        <p>Version: 0.2.3</p>
                        <p>ハイブリッド会議の視認性を向上させるローカル完結型ツール</p>
                        <hr>
                        <p><strong>データの保存場所とリスク</strong></p>
                        <p>記録されたデータ（カメラ設定等）はすべてブラウザ内の IndexedDB に保存されます。ブラウザのキャッシュクリア等によりデータが削除される可能性がありますのでご注意ください。</p>
                        <hr>
                        <p><strong>プライバシーとセキュリティ</strong></p>
                        <p>本アプリは外部への通信を一切行いません。トラッキングやデータ収集も行わない完全ローカル動作です。</p>
                        <hr>
                        <p>開発者<br>Masanori SATAKE</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="initial-overlay">
            <button id="start-btn" class="m3-button-filled">
                <span class="material-symbols-outlined">videocam</span>
                カメラを起動
            </button>
        </div>

        <div id="camera-dialog" class="hidden">
            <div id="camera-dialog-overlay"></div>
            <div class="dialog-content m3-surface">
                <div class="dialog-header">
                    <h2 class="m3-title">カメラ追加</h2>
                </div>
                <div class="dialog-body">
                    <div id="camera-list-container">
                        <!-- Camera list with checkboxes will be injected here -->
                    </div>
                </div>
                <div class="dialog-actions">
                    <button id="dialog-cancel-btn" class="m3-button">キャンセル</button>
                    <button id="dialog-add-btn" class="m3-button-filled">追加</button>
                </div>
            </div>
        </div>

        <main id="camera-container">
            <!-- Camera slots will be injected here -->
        </main>

        <div id="snackbar" class="hidden">
            <span id="snackbar-message"></span>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
