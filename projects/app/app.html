<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniView-Solo</title>
    <link rel="stylesheet" href="shared/css/m3-theme.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body class="theme-light">
    <div id="app" class="layout-narrow">
        <div id="initial-overlay">
            <button id="start-btn" class="m3-button-filled">
                <span class="material-symbols-outlined">videocam</span>
                カメラを起動
            </button>
        </div>
        <main id="camera-container">
            <!-- Camera slots will be injected here -->
        </main>

        <div id="snackbar" class="hidden">
            <span id="snackbar-message"></span>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
