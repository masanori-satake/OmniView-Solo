<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="permissionTitle">カメラ権限の許可 - OmniView-Solo</title>
    <link rel="stylesheet" href="shared/css/m3-theme.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            font-family: system-ui, -apple-system, sans-serif;
        }
        .container {
            text-align: center;
            max-width: 400px;
            padding: 24px;
            border-radius: 28px;
            background-color: var(--md-sys-color-surface-container);
            box-shadow: var(--md-sys-elevation-level1);
        }
        h1 { font-size: 1.5rem; margin-bottom: 16px; }
        p { margin-bottom: 24px; line-height: 1.5; }
    </style>
</head>
<body class="theme-light">
    <div class="container">
        <h1 data-i18n="permissionHeader">カメラ権限が必要です</h1>
        <p data-i18n="permissionDesc">OmniView-Soloがカメラを使用するには、ブラウザの権限許可が必要です。下のボタンを押して、表示されるダイアログで「許可」を選択してください。</p>
        <button id="grant-btn" class="m3-button-filled" data-i18n="permissionGrantBtn">
            カメラの使用を許可する
        </button>
        <p id="status-msg" style="margin-top: 16px;"></p>
    </div>
    <script src="js/permission.js"></script>
</body>
</html>
