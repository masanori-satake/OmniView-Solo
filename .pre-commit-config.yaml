# .pre-commit-config.yaml
repos:
- repo: local
  hooks:
  - id: check-version
    name: check-version
    entry: python3 scripts/check_version.py
    language: system
    # Always run version check when source files change
    files: ^(package\.json|projects/app/.*|shared/.*|README\.md)$
  - id: create-package
    name: create-package
    entry: python3 scripts/create_package.py
    language: system
    stages: [push]
