ci:
  autofix_commit_msg: "[pre-commit.ci] auto fixes from pre-commit.com hooks"
  autofix_prs: true
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly

# .pre-commit-config.yaml
repos:
- repo: local
  hooks:
  - id: check-version
    name: check-version
    entry: python3 scripts/check_version.py
    language: system
    # Always run version check when source files change
    files: ^(package\.json|projects/app/.*|README\.md)$
  - id: create-package
    name: create-package
    entry: python3 scripts/create_package.py
    language: system
    stages: [push]
